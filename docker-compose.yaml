services:
  backend:
    build:
      context: ./server
    ports:
      - "2000:2000"
    volumes:
        - hub_db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/hub.db
      - CLIENT_URL=${CLIENT_URL}

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL}

volumes:
  hub_db_data:
